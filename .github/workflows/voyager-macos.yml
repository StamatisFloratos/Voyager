name: Build Voyager for Mac
on:
  workflow_dispatch:
  push:
    branches: [voyager]
permissions:
  contents: read
concurrency:
  group: voyager-macos-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: 1
jobs:
  browser:
    runs-on: xcode-27
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/browser/build-ardiacore/prebuilt
          key: voyager-native-${{ hashFiles('apps/browser/macos/Podfile.lock', 'packages/ardiacore/prebuilt-engines.tsv') }}
      - run: pnpm pods
      - name: Build a standalone app
        run: pnpm --filter @voyager/browser build
      - name: Verify the bundle and open a scratch profile
        run: |
          app=apps/browser/build/Build/Products/Release/Voyager.app
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.stamatisfloratos.voyager
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = Voyager
          scripts/release/launch-check.sh "$PWD/$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Voyager.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Voyager-macOS-arm64
          path: ${{ runner.temp }}/Voyager.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
  checks:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node apps/ios/scripts/bundle-shared.mjs --check
      - run: swift test --package-path apps/ios/Packages/VoyagerKit
      - name: Build Voyager for the simulator
        run: >-
          xcodebuild -project apps/ios/Voyager.xcodeproj -scheme Voyager -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios"
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -quiet build
