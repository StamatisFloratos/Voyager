name: Voyager
options:
  bundleIdPrefix: com.stamatisfloratos.voyager
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  VoyagerKit:
    path: Packages/VoyagerKit
targets:
  Voyager:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: VoyagerKit
        product: VoyagerShared
      - package: VoyagerKit
        product: VoyagerSync
      - package: VoyagerKit
        product: VoyagerBrowser
      - package: VoyagerKit
        product: VoyagerDesign
      - target: VoyagerWidgets
      - target: VoyagerShare
      - target: VoyagerOpen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stamatisfloratos.voyager.ios
        PRODUCT_NAME: Voyager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Voyager-Info.plist
        CODE_SIGN_ENTITLEMENTS: $(VOYAGER_ENTITLEMENTS_$(VOYAGER_DEFAULT_BROWSER))
        VOYAGER_DEFAULT_BROWSER: NO
        VOYAGER_ENTITLEMENTS_NO: Config/Voyager.entitlements
        VOYAGER_ENTITLEMENTS_YES: Config/Voyager-DefaultBrowser.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Voyager
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Voyager uses the camera to scan the sync code your Mac shows, and for websites that ask to use it."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voyager uses the microphone when you search with your voice, and for websites that ask to use it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Voyager turns what you say into a search when you use Voice Search."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Websites you visit may ask for your location."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Voyager saves images you choose to your photo library."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  VoyagerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        type: syncedFolder
    dependencies:
      - package: VoyagerKit
        product: VoyagerBrowser
      - package: VoyagerKit
        product: VoyagerDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stamatisfloratos.voyager.ios.widgets
        PRODUCT_NAME: VoyagerWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Voyager
        SKIP_INSTALL: YES
  VoyagerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        type: syncedFolder
    dependencies:
      - package: VoyagerKit
        product: VoyagerBrowser
      - package: VoyagerKit
        product: VoyagerDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stamatisfloratos.voyager.ios.share
        PRODUCT_NAME: VoyagerShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Voyager
        SKIP_INSTALL: YES
  VoyagerOpen:
    type: app-extension
    platform: iOS
    sources:
      - path: Action
        type: syncedFolder
    dependencies:
      - package: VoyagerKit
        product: VoyagerDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stamatisfloratos.voyager.ios.open
        PRODUCT_NAME: VoyagerOpen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Open-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Open.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Open in Voyager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
schemes:
  Voyager:
    build:
      targets:
        Voyager: all
    run:
      config: Debug
    archive:
      config: Release
